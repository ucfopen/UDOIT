services:
  db:
    container_name: udoit3-db
    image: mysql:latest
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udoit3
      MYSQL_USER: udoit
      MYSQL_PASSWORD: udoit
    ports:
      - "3306:3306"
  db-new:
    container_name: udoit3-db-new
    image: mysql:latest
    volumes:
      - dbdatanew:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udoit3
      MYSQL_USER: udoit
      MYSQL_PASSWORD: udoit
    ports:
      - "3307:3306"
  # Uncomment this block and comment the next db block
  # to use Postgres instead of MySQL
  # db:
  #   container_name: udoit3-db
  #   image: postgres:alpine
  #   restart: always
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: udoit
  #     POSTGRES_PASSWORD: udoit
  #     POSTGRES_DB: udoit3
  web:
      container_name: udoit3-web
      image: nginx:latest
      ports:
        - "8000:80"
      volumes:
        - .:/var/www/html
        - ./build/nginx/local.conf:/etc/nginx/conf.d/default.conf
        - ./go-rewrite:/go-rewrite
      links:
          - php
      env_file:
        - .env
  php:
      container_name: udoit3-php
      build:
        context: ./build/nginx
        dockerfile: Dockerfile.php.pdo.mysql
      volumes:
        - ./:/var/www/html
        - type: bind
          source: ./build/nginx/php-custom.ini
          target: /usr/local/etc/php/conf.d/php-custom.ini
      env_file:
        - .env
  composer:
      container_name: udoit3-composer
      build:
        context: ./build/nginx
        dockerfile: Dockerfile.composer
      command: >
        sh -c '
          if [ "$APP_ENV" = "dev" ]; then
            echo "composer install (dev)" &&
            composer install --no-interaction --no-progress --optimize-autoloader;
          else
            echo "composer install (prod)" &&
            composer install --no-dev --no-interaction --no-progress --optimize-autoloader;
          fi
        '
      volumes:
        - ./:/app
      env_file:
        - .env
  go-app:
    container_name: udoit3-go
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - ./go-rewrite:/app
      - ./translations:/app/translations
    ports:
      - "8080:8080"
    environment:
      - CGO_ENABLED=0
    command: sh -c "go mod download && go run ./cmd/api"
    depends_on:
      - db-new
      - redis
    env_file:
      - .env
  register-tenant:
    container_name: udoit3-register-tenant
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - ./go-rewrite:/app
    command: sh -c "go mod download && go run ./cmd/register-tenant -config ./config/register-tenant.secret.yaml"
    depends_on:
      - db-new
    env_file:
      - .env
    profiles:
      - manual
  redis:
    container_name: udoit3-redis
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
  yarn:
      container_name: udoit3-yarn
      build:
        context: ./build/nginx
        dockerfile: Dockerfile.yarn
      volumes:
        - ./:/app
      env_file:
        - .env
      command: >
        bash -c '
        cd /app &&
        yarn install &&
        yarn watch'
  ace:
    container_name: udoit3-ace
    image: ghcr.io/ucfopen/equal-access-server:main
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: udoit3-migrate
    volumes:
      - ./go-rewrite/db/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "mysql://root:root@tcp(db-new:3306)/udoit3",
        "up"
      ]
    depends_on:
      - db-new
    networks:
      - default
  

volumes:
  web:
  dbdata:
  dbdatanew:
