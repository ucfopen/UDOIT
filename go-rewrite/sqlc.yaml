version: "2"

sql:
  - engine: "mysql"
    schema:
      - "db/migrations/*.up.sql"
    queries:
      - "internal/auth/internal/infrastructure/queries/*.sql"
    gen:
      go:
        package: "authsqlc"
        out: "internal/auth/internal/infrastructure/sqlc"
        sql_package: "database/sql"

  - engine: "mysql"
    schema:
      - "db/migrations/*.up.sql"
    queries:
      - "internal/lms/internal/storage/mysql/queries/*.sql"
    gen:
